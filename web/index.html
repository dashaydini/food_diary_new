</head>

<body>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      ad_storage: 'denied',
      analytics_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      wait_for_update: 500,
    });

    let btwAdsenseScriptPromise = null;
    window.btwPrivacy = {
      advertisingAllowed: false,
      setConsent: (allowed) => {
        window.btwPrivacy.advertisingAllowed = allowed === true;
        gtag('consent', 'update', {
          ad_storage: allowed ? 'granted' : 'denied',
          analytics_storage: 'denied',
          ad_user_data: allowed ? 'granted' : 'denied',
          ad_personalization: allowed ? 'granted' : 'denied',
        });
      },
      loadAdsense: () => {
        if (!window.btwPrivacy.advertisingAllowed) {
          return Promise.reject(new Error('advertising_consent_required'));
        }
        if (btwAdsenseScriptPromise) return btwAdsenseScriptPromise;
        btwAdsenseScriptPromise = new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.async = true;
          script.crossOrigin = 'anonymous';
          script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4954700760640290';
          script.onload = resolve;
          script.onerror = () => {
            btwAdsenseScriptPromise = null;
            reject(new Error('adsense_script_failed'));
          };
          document.head.appendChild(script);
        });
        return btwAdsenseScriptPromise;
      },
    };

    let btwDeferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      btwDeferredInstallPrompt = event;
    });
    window.addEventListener('appinstalled', () => {
      btwDeferredInstallPrompt = null;
      localStorage.setItem('btw_app_installed', 'true');
    });
    window.btwInstall = {
      status: () => {
        const standalone = window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true ||
          localStorage.getItem('btw_app_installed') === 'true';
        if (standalone) return 'installed';
        const dismissedAt = Number(localStorage.getItem('btw_install_dismissed_at') || 0);
        if (Date.now() - dismissedAt < 7 * 24 * 60 * 60 * 1000) return 'dismissed';
        const ua = navigator.userAgent || '';
        const isIOS = /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (isIOS) return 'ios';
        if (/Android/i.test(ua)) {
          return btwDeferredInstallPrompt ? 'android' : 'pending';
        }
        return 'none';
      },
      install: async () => {
        if (!btwDeferredInstallPrompt) return false;
        btwDeferredInstallPrompt.prompt();
        const choice = await btwDeferredInstallPrompt.userChoice;
        if (choice.outcome === 'accepted') btwDeferredInstallPrompt = null;
        return choice.outcome === 'accepted';
      },
      dismiss: () => localStorage.setItem('btw_install_dismissed_at', String(Date.now())),
    };
    window.btwPush = {
      isSupported: async () => {
        const supported = 'serviceWorker' in navigator &&
          'PushManager' in window && 'Notification' in window;
        const ua = navigator.userAgent || '';
        const isIOS = /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const standalone = window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;
        return supported && (!isIOS || standalone);
      },
      isSubscribed: async () => {
        const registration = await navigator.serviceWorker.getRegistration('/');
        return !!(registration && await registration.pushManager.getSubscription());
      },
      subscribe: async (publicKey) => {
        if (Notification.permission === 'denied') {
          throw new Error('notifications_blocked');
        }
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') throw new Error('permission_denied');
        const registration = await navigator.serviceWorker.register(
          '/push-service-worker.js', { scope: '/' }
        );
        const worker = registration.installing || registration.waiting;
        if (!registration.active && worker) {
          await Promise.race([
            new Promise((resolve, reject) => {
              worker.addEventListener('statechange', () => {
                if (worker.state === 'activated') resolve();
                if (worker.state === 'redundant') reject(new Error('service_worker_failed'));
              });
            }),
            new Promise((_, reject) => setTimeout(
              () => reject(new Error('service_worker_timeout')), 10000
            )),
          ]);
        }
        let subscription = await registration.pushManager.getSubscription();
        if (!subscription) {
          const padding = '='.repeat((4 - publicKey.length % 4) % 4);
          const base64 = (publicKey + padding).replace(/-/g, '+').replace(/_/g, '/');
          const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: bytes,
          });
        }
        return JSON.stringify(subscription.toJSON());
      },
      unsubscribe: async () => {
        const registration = await navigator.serviceWorker.getRegistration('/');
        if (!registration) return '';
        const subscription = await registration.pushManager.getSubscription();
        if (!subscription) return '';
        const endpoint = subscription.endpoint;
        await subscription.unsubscribe();
        return endpoint;
      },
    };
    window.btwAdsense = {
      mountHomeBanner: async (container) => {
        try {
          await window.btwPrivacy.loadAdsense();
        } catch (error) {
          console.warn('BITE THE WAY: AdSense requires advertising consent.', error);
          return false;
        }
        container.style.width = '100%';
        container.style.height = '100%';
        container.style.display = 'flex';
        container.style.alignItems = 'center';
        container.style.justifyContent = 'center';

        const ad = document.createElement('ins');
        ad.className = 'adsbygoogle';
        ad.style.display = 'block';
        ad.style.width = '100%';
        ad.style.height = '100%';
        ad.setAttribute('data-ad-client', 'ca-pub-4954700760640290');
        ad.setAttribute('data-ad-slot', '7674598545');
        ad.setAttribute('data-ad-format', 'horizontal');
        ad.setAttribute('data-full-width-responsive', 'true');
        container.replaceChildren(ad);

        const statusPromise = new Promise((resolve) => {
          let completed = false;
          const finish = (filled) => {
            if (completed) return;
            completed = true;
            observer.disconnect();
            resolve(filled);
          };
          const readStatus = () => {
            const status = ad.getAttribute('data-ad-status');
            if (status === 'filled') finish(true);
            if (status === 'unfilled' || status === 'unfill-optimized') {
              finish(false);
            }
          };
          const observer = new MutationObserver(readStatus);
          observer.observe(ad, {
            attributes: true,
            attributeFilter: ['data-ad-status'],
          });
          window.setTimeout(() => finish(false), 20000);
        });

        const requestAd = () => {
          if (!ad.isConnected) {
            window.requestAnimationFrame(requestAd);
            return;
          }
          try {
            window.adsbygoogle = window.adsbygoogle || [];
            window.adsbygoogle.push({});
          } catch (error) {
            console.warn('BITE THE WAY: AdSense banner was not loaded.', error);
          }
        };
        window.requestAnimationFrame(requestAd);
        return statusPromise;
      },
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>

</body>
