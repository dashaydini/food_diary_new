  <script>
    let btwDeferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      btwDeferredInstallPrompt = event;
    });
    window.addEventListener('appinstalled', () => {
      btwDeferredInstallPrompt = null;
      localStorage.setItem('btw_app_installed', 'true');
    });
    window.btwInstall = {
      status: () => {
        const standalone = window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true ||
          localStorage.getItem('btw_app_installed') === 'true';
        if (standalone) return 'installed';
        const dismissedAt = Number(localStorage.getItem('btw_install_dismissed_at') || 0);
        if (Date.now() - dismissedAt < 7 * 24 * 60 * 60 * 1000) return 'dismissed';
        const ua = navigator.userAgent || '';
        const isIOS = /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (isIOS) return 'ios';
        if (/Android/i.test(ua)) {
          return btwDeferredInstallPrompt ? 'android' : 'pending';
        }
        return 'none';
      },
      install: async () => {
        if (!btwDeferredInstallPrompt) return false;
        btwDeferredInstallPrompt.prompt();
        const choice = await btwDeferredInstallPrompt.userChoice;
        if (choice.outcome === 'accepted') btwDeferredInstallPrompt = null;
        return choice.outcome === 'accepted';
      },
      dismiss: () => localStorage.setItem('btw_install_dismissed_at', String(Date.now())),
    };
    window.btwPush = {
      isSupported: async () => {
        const supported = 'serviceWorker' in navigator &&
          'PushManager' in window && 'Notification' in window;
        const ua = navigator.userAgent || '';
        const isIOS = /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const standalone = window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;
        return supported && (!isIOS || standalone);
      },
      isSubscribed: async () => {
        const registration = await navigator.serviceWorker.getRegistration('/');
        return !!(registration && await registration.pushManager.getSubscription());
      },
      subscribe: async (publicKey) => {
        if (Notification.permission === 'denied') {
          throw new Error('notifications_blocked');
        }
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') throw new Error('permission_denied');
        const registration = await navigator.serviceWorker.register(
          '/push-service-worker.js', { scope: '/' }
        );
        const worker = registration.installing || registration.waiting;
        if (!registration.active && worker) {
          await Promise.race([
            new Promise((resolve, reject) => {
              worker.addEventListener('statechange', () => {
                if (worker.state === 'activated') resolve();
                if (worker.state === 'redundant') reject(new Error('service_worker_failed'));
              });
            }),
            new Promise((_, reject) => setTimeout(
              () => reject(new Error('service_worker_timeout')), 10000
            )),
          ]);
        }
        let subscription = await registration.pushManager.getSubscription();
        if (!subscription) {
          const padding = '='.repeat((4 - publicKey.length % 4) % 4);
          const base64 = (publicKey + padding).replace(/-/g, '+').replace(/_/g, '/');
          const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: bytes,
          });
        }
        return JSON.stringify(subscription.toJSON());
      },
      unsubscribe: async () => {
        const registration = await navigator.serviceWorker.getRegistration('/');
        if (!registration) return '';
        const subscription = await registration.pushManager.getSubscription();
        if (!subscription) return '';
        const endpoint = subscription.endpoint;
        await subscription.unsubscribe();
        return endpoint;
      },
    };
  </script>
