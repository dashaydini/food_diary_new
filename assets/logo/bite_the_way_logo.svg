<?xml version="1.0" encoding="utf-8"?>
<!-- Elegant wordmark + monogram for BITE THE WAY -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="50%" stop-color="#E6B93F"/>
      <stop offset="100%" stop-color="#C79A2C"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <!-- Dark rounded square backdrop -->
  <g transform="translate(128,128)">
    <rect x="0" y="0" width="768" height="768" rx="120" fill="#0B0B0B" />

    <!-- Subtle path emblem (represents a tasteful journey) -->
    <path d="M160 520 C260 380, 420 360, 560 280 C680 220, 700 180, 720 140"
          stroke="url(#gold)" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.95" />

    <!-- Monogram circle with BTW letters -->
    <g transform="translate(192,176)">
      <circle cx="192" cy="192" r="140" fill="#0E0E0E" filter="url(#soft)" />
      <text x="192" y="230" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
            font-size="140" font-weight="700" fill="url(#gold)" letter-spacing="4">BTW</text>
    </g>

    <!-- Wordmark: elegant serif, spaced uppercase -->
    <text x="384" y="660" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="48" font-weight="600" fill="#F8EDE0" letter-spacing="6">BITE THE WAY</text>
  </g>

</svg>
