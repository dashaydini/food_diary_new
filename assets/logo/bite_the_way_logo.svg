<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Elegant dark background with gold monogram and name -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Monogram circle -->
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#FFD27A" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>

  <!-- Monogram: stylized BTW -->
  <g transform="translate(64,64)">
    <circle cx="192" cy="128" r="128" fill="#0B0B0B" opacity="0.9" />

    <g fill="url(#g)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
      <text x="192" y="110" font-size="96" font-weight="700" letter-spacing="2">BTW</text>
      <text x="192" y="180" font-size="20" fill="#F8EED9">BITE THE WAY</text>
    </g>
  </g>

  <!-- Accent line -->
  <path d="M64 420 L448 420" stroke="#D4AF37" stroke-width="2" opacity="0.6" />

</svg>
