name: food_diary
description: Coffee Diary app

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  image_picker: ^1.1.2

  geolocator: ^14.0.3
  geocoding: ^4.0.0

  url_launcher: ^6.3.1

  shared_preferences: ^2.3.3

  flutter_map: ^8.0.0
  latlong2: ^0.10.1
  http: ^1.6.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  supabase_flutter: ^2.17.1
  uuid: ^4.6.0
  share_plus: ^13.3.0
  flutter_svg: ^2.0.7

dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.11.0

  build_runner: ^2.4.13
  hive_generator: ^2.0.1


flutter:

  uses-material-design: true
  assets:
    - assets/logo/bite_the_way_logo.svg
    - assets/logo/icon.png

# Configuration for automatic launcher icon generation.
flutter_icons:
  android: true
  ios: true
  image_path: assets/logo/icon.png
  adaptive_icon_background: "#0B0B0B"